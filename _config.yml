# Site identity
title: Connor L. Box
first_name: Connor
middle_name: L.
last_name: Box
description: >
  Theoretical and computational chemist developing first-principles methods for
  nonadiabatic dynamics, electron-phonon coupling, and nuclear quantum effects.
keywords: quantum dynamics, nonadiabaticity, electronic friction, electron-phonon coupling, surface chemistry, superconductivity
lang: en
icon: ⚛️
url: https://clbox.github.io
baseurl:

# Contact and footer
contact_note: Best reached via email for academic or collaboration inquiries.
footer_text: >
  Powered by <a href="https://jekyllrb.com/" target="_blank">Jekyll</a> and
  hosted by <a href="https://pages.github.com/" target="_blank">GitHub Pages</a>.
last_updated: true

# Layout
navbar_fixed: true
footer_fixed: true
back_to_top: true
max_width: 930px
bib_search: true

# Social previews and search metadata
serve_og_meta: true
serve_schema_org: true
og_image: https://clbox.github.io/assets/img/me.png

# Published content
collections:
  news:
    output: false
  projects:
    output: true

# Build
markdown: kramdown
kramdown:
  input: GFM

include:
  - _pages
exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - vendor

plugins:
  - jekyll-email-protect
  - jekyll-imagemagick
  - jekyll-link-attributes
  - jekyll-regex-replace
  - jekyll/scholar
  - jekyll-sitemap

defaults:
  - scope:
      path: assets
    values:
      sitemap: false

sass:
  style: compressed

# Publications
scholar:
  last_name: [Box]
  first_name: [Connor, L.]
  style: apa
  locale: en
  source: /_bibliography/
  bibliography: papers.bib
  bibliography_template: bib
  bibtex_filters: [latex, smallcaps, superscript]
  replace_strings: true
  join_strings: true
  query: "@*"
  group_by: year
  group_order: descending

enable_publication_badges:
  altmetric: true
  dimensions: true
enable_publication_thumbnails: true
max_author_limit: 3
more_authors_animation_delay: 10

# External links and images
external_links:
  enabled: true
  rel: external noopener
  target: _blank
  exclude:

imagemagick:
  enabled: true
  widths: [480, 800, 1400]
  input_directories:
    - assets/img/
  input_formats: [.jpg, .jpeg, .png, .gif]
  output_formats:
    webp: "-quality 85"
lazy_loading_images: true

# Features used by the current pages
enable_darkmode: true
enable_medium_zoom: true
enable_progressbar: true

# CDN dependencies used by the active layouts
third_party_libraries:
  google_fonts:
    url:
      fonts: https://fonts.googleapis.com/css?family=Roboto:300,400,500,700|Roboto+Slab:100,300,400,500,700|Material+Icons&display=swap
  jquery:
    integrity:
      js: sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4=
    url:
      js: https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js
  mdb:
    integrity:
      css: sha256-jpjYvU3G3N6nrrBwXJoVEYI/0zw8htfFnhT9ljN3JJw=
      js: sha256-NdbiivsvWt7VYCt6hYNT3h/th9vSTL4EDWeGs5SN3DA=
    url:
      css: https://cdn.jsdelivr.net/npm/mdbootstrap@4.20.0/css/mdb.min.css
      js: https://cdn.jsdelivr.net/npm/mdbootstrap@4.20.0/js/mdb.min.js
  medium_zoom:
    integrity:
      js: sha256-ZgMyDAIYDYGxbcpJcfUnYwNevG/xi9OHKaR/8GK+jWc=
    url:
      js: https://cdn.jsdelivr.net/npm/medium-zoom@1.1.0/dist/medium-zoom.min.js

# CV sections, in display order
jsonresume: [basics, work, education, awards]
